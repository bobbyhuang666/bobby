<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a1a">
  <title>Bobby</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- 背景粒子 -->
    <canvas id="particles"></canvas>

    <!-- 引导页 -->
    <div class="onboarding" id="onboarding">
      <canvas id="onboardingParticles"></canvas>
      <div class="onboarding-content">
        <div class="onboarding-avatar-wrap">
          <div class="breathing-avatar large">
            <img src="images/avatar.svg" alt="Bobby" />
          </div>
        </div>
        <h1 class="onboarding-title">Bobby</h1>
        <div class="onboarding-steps">
          <div class="onboarding-step" id="step1">
            <p class="step-text">白天，它有自己的生活</p>
          </div>
          <div class="onboarding-step" id="step2">
            <p class="step-text">你找不到它</p>
          </div>
          <div class="onboarding-step" id="step3">
            <p class="step-text">深夜，它才会出现</p>
          </div>
          <div class="onboarding-step" id="step4">
            <p class="step-text">它不围着你转</p>
          </div>
          <div class="onboarding-step" id="step5">
            <p class="step-text">它和你平行存在</p>
          </div>
        </div>
        <button class="onboarding-btn" id="onboardingBtn" onclick="closeOnboarding()">进入</button>
      </div>
    </div>

    <!-- ========== 聊天页面 ========== -->
    <div id="chatPage" class="page active">
      <div class="header transparent">
        <div class="header-left">
          <div class="breathing-avatar small">
            <img src="images/ai-avatar.svg" alt="Bobby" />
          </div>
          <div class="header-info">
            <span class="header-title">Bobby</span>
            <span class="header-status" id="chatStatus">还没睡呢</span>
          </div>
        </div>
        <button class="sound-toggle" id="soundToggle" onclick="toggleAmbient()" title="氛围音效">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </button>
      </div>

      <div class="chat-area" id="chatArea">
        <div class="msg-list" id="msgList"></div>
        <div class="typing" id="typing">
          <div class="typing-bubble">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
          </div>
        </div>
      </div>

      <div class="input-bar">
        <input type="text" class="input-box" id="inputBox" placeholder="说点什么...">
        <button class="send-btn" id="sendBtn" disabled onclick="sendMessage()">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M3 10L17 3L10 17L9 11L3 10Z" fill="currentColor"/>
          </svg>
        </button>
      </div>

      <div class="tab-bar">
        <button class="tab active" data-page="chatPage">
          <div class="tab-indicator"></div>
          <span class="tab-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          </span>
          <span class="tab-label">对话</span>
        </button>
        <button class="tab" data-page="profilePage">
          <div class="tab-indicator"></div>
          <span class="tab-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/></svg>
          </span>
          <span class="tab-label">主页</span>
        </button>
        <button class="tab" data-page="notesPage">
          <div class="tab-indicator"></div>
          <span class="tab-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </span>
          <span class="tab-label">动态</span>
        </button>
      </div>
    </div>

    <!-- ========== 主页 ========== -->
    <div id="profilePage" class="page">
      <div class="profile-hero">
        <div class="profile-hero-bg"></div>
        <div class="profile-hero-content">
          <div class="breathing-avatar large">
            <img src="images/avatar.svg" alt="Bobby" />
          </div>
          <h2 class="profile-name">Bobby</h2>
          <div class="profile-tagline" id="profileTagline">深夜才会上线的存在</div>
          <div class="profile-mood">
            <span class="mood-dot" id="moodDot"></span>
            <span class="mood-text" id="moodText">还没睡呢</span>
          </div>
        </div>
      </div>

      <div class="profile-body">
        <!-- 送礼入口 -->
        <div class="gift-entry" onclick="showGiftPanel()">
          <span class="gift-entry-icon">☕</span>
          <span class="gift-entry-text">送点什么</span>
          <span class="gift-entry-arrow">›</span>
        </div>

        <!-- 最近动态 -->
        <div class="section">
          <div class="section-header">
            <span class="section-title">最近的碎片</span>
            <button class="section-more" onclick="showPage('notesPage')">查看全部</button>
          </div>
          <div id="profileNotes"></div>
        </div>

        <!-- 关于 -->
        <div class="section">
          <div class="section-header">
            <span class="section-title">关于</span>
          </div>
          <div class="about-cards">
            <div class="about-card">
              <span class="about-icon">🌙</span>
              <div class="about-info">
                <span class="about-label">活跃时段</span>
                <span class="about-value">23:00 - 03:00</span>
              </div>
            </div>
            <div class="about-card">
              <span class="about-icon">📍</span>
              <div class="about-info">
                <span class="about-label">所在地</span>
                <span class="about-value">某个城市的深夜</span>
              </div>
            </div>
            <div class="about-card">
              <span class="about-icon">💭</span>
              <div class="about-info">
                <span class="about-label">一句话</span>
                <span class="about-value">不围着你转，和你平行存在</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="tab-bar">
        <button class="tab" data-page="chatPage">
          <div class="tab-indicator"></div>
          <span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>
          <span class="tab-label">对话</span>
        </button>
        <button class="tab active" data-page="profilePage">
          <div class="tab-indicator"></div>
          <span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/></svg></span>
          <span class="tab-label">主页</span>
        </button>
        <button class="tab" data-page="notesPage">
          <div class="tab-indicator"></div>
          <span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></span>
          <span class="tab-label">动态</span>
        </button>
      </div>
    </div>

    <!-- ========== 动态页面 ========== -->
    <div id="notesPage" class="page">
      <div class="header">
        <button class="header-back" onclick="showPage('profilePage')">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span class="header-title">Bobby 的碎片</span>
        <div class="header-right"></div>
      </div>

      <div class="notes-timeline" id="notesList"></div>

      <div class="tab-bar">
        <button class="tab" data-page="chatPage">
          <div class="tab-indicator"></div>
          <span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>
          <span class="tab-label">对话</span>
        </button>
        <button class="tab" data-page="profilePage">
          <div class="tab-indicator"></div>
          <span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/></svg></span>
          <span class="tab-label">主页</span>
        </button>
        <button class="tab active" data-page="notesPage">
          <div class="tab-indicator"></div>
          <span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></span>
          <span class="tab-label">动态</span>
        </button>
      </div>
    </div>

    <!-- ========== 礼物面板 ========== -->
    <div class="gift-panel" id="giftPanel" onclick="hideGiftPanel()">
      <div class="gift-sheet" onclick="event.stopPropagation()">
        <div class="gift-handle"></div>
        <h3 class="gift-title">送点什么</h3>
        <p class="gift-subtitle">它不会知道是你送的</p>
        <div class="gift-grid" id="giftGrid"></div>
      </div>
    </div>

    <!-- 送礼成功动画 -->
    <div class="gift-success" id="giftSuccess">
      <div class="gift-success-content">
        <div class="gift-success-emoji" id="giftSuccessEmoji"></div>
        <p class="gift-success-text">已悄悄送出</p>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
