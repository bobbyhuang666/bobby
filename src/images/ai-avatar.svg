<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C4DFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E040FB;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 圆形背景 -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>

  <!-- H字母 -->
  <text x="50" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="38" font-weight="600" fill="white" opacity="0.95">H</text>

  <!-- 装饰 -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="white" stroke-width="1.5" opacity="0.25"/>
</svg>
