<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" style="stop-color:#16162a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a14;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#c8a97a;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#c8a97a;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5b8;stop-opacity:0.65" />
      <stop offset="100%" style="stop-color:#c8a97a;stop-opacity:0.4" />
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="circle">
      <circle cx="50" cy="50" r="48"/>
    </clipPath>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>

  <g clip-path="url(#circle)">
    <circle cx="50" cy="50" r="40" fill="url(#glow)"/>

    <!-- 弯月 -->
    <circle cx="58" cy="30" r="11" fill="url(#moonGrad)"/>
    <circle cx="62.5" cy="27.5" r="10" fill="#10101e"/>
    <circle cx="58" cy="30" r="14" fill="none" stroke="rgba(200,169,122,0.05)" stroke-width="4" filter="url(#softGlow)"/>

    <!-- 星星 -->
    <circle cx="38" cy="22" r="0.8" fill="#e8d5b8" opacity="0.5" filter="url(#softGlow)"/>
    <circle cx="72" cy="40" r="0.6" fill="#c8a97a" opacity="0.35" filter="url(#softGlow)"/>
    <circle cx="34" cy="38" r="0.5" fill="#c8a97a" opacity="0.3" filter="url(#softGlow)"/>
    <circle cx="68" cy="20" r="0.4" fill="#e8d5b8" opacity="0.25"/>
    <circle cx="42" cy="50" r="0.35" fill="#c8a97a" opacity="0.2"/>

    <!-- 人物剪影 -->
    <g opacity="0.8">
      <ellipse cx="44" cy="58" rx="8.5" ry="9.5" fill="#8a9ab5"/>
      <path d="M35.5 54 Q37.5 46 44 45 Q50.5 46 52.5 54 Q50.5 50 44 49 Q37.5 50 35.5 54Z" fill="#6b7b95"/>
      <path d="M36 66 Q37 58 44 56 Q51 58 52 66 Q49 68 44 69 Q39 68 36 66Z" fill="#8a9ab5"/>
      <path d="M34 74 Q35 68 38 66 Q44 65 50 66 Q53 68 54 74" stroke="#8a9ab5" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M40 68 Q44 71 48 68" stroke="#7a8aa5" stroke-width="1" fill="none" opacity="0.4"/>
    </g>

    <!-- 窗框 -->
    <rect x="60" y="55" width="16" height="20" rx="1" stroke="rgba(100,100,140,0.18)" stroke-width="0.6" fill="none"/>
    <line x1="68" y1="55" x2="68" y2="75" stroke="rgba(100,100,140,0.12)" stroke-width="0.4"/>
    <line x1="60" y1="65" x2="76" y2="65" stroke="rgba(100,100,140,0.12)" stroke-width="0.4"/>
    <rect x="60" y="55" width="16" height="20" rx="1" fill="rgba(200,169,122,0.03)"/>
  </g>

  <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(200,169,122,0.15)" stroke-width="0.8"/>
</svg>
